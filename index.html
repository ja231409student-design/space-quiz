<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5fb">
  <title>Orbit — Space quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f4f5fb;
      --card: #fff;
      --ink: #20213a;
      --muted: #777990;
      --line: #e8e9f2;
      --accent: #6958e8;
      --accent-soft: #f0edff;
      --question-ink: #a92b70;
      --question-accent: #e454a2;
      --green: #13895f;
      --green-bg: #e8f8f0;
      --red: #c74755;
      --red-bg: #fff0f0;
      --shadow: 0 24px 70px rgb(42 40 86 / 9%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10111b;
        --card: #191a28;
        --ink: #f0efff;
        --muted: #a4a4bb;
        --line: #303143;
        --accent: #a79aff;
        --accent-soft: #292541;
        --question-ink: #ff9bd0;
        --question-accent: #f276b6;
        --green: #69d6a6;
        --green-bg: #18382e;
        --red: #ff929a;
        --red-bg: #40252c;
        --shadow: 0 24px 70px rgb(0 0 0 / 30%);
      }
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      isolation: isolate;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 34px 20px 44px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgb(112 96 232 / 10%), transparent 43rem),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: -12px 0;
      content: "";
      pointer-events: none;
      opacity: .3;
      background-image:
        radial-gradient(1px 1px at 18px 26px, color-mix(in srgb, var(--ink) 55%, transparent) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 92px 74px, color-mix(in srgb, var(--accent) 58%, transparent) 50%, transparent 100%),
        radial-gradient(1px 1px at 154px 38px, color-mix(in srgb, var(--ink) 48%, transparent) 50%, transparent 100%),
        radial-gradient(1px 1px at 198px 112px, color-mix(in srgb, var(--question-accent) 46%, transparent) 50%, transparent 100%);
      background-size: 220px 150px;
      animation: star-drift 36s ease-in-out infinite alternate;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 540px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgb(105 88 232 / 18%);
      border-radius: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 18px;
    }

    .edition {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .quiz-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      animation: arrive .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .card-inner { padding: 30px 34px 34px; }

    .quiz-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .question-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .question-count strong { color: var(--ink); }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      transition: transform .2s ease, border-color .2s ease;
    }

    .score-pill.bump { animation: bump .32s ease; }
    .score-pill strong { color: var(--ink); font-variant-numeric: tabular-nums; }

    .progress-track {
      height: 7px;
      overflow: hidden;
      margin-bottom: 32px;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8273f4, #bc7cf4);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(25px, 6vw, 31px);
      line-height: 1.2;
      letter-spacing: -.045em;
    }

    #question {
      position: relative;
      margin: 0 0 10px;
      padding: 19px 20px;
      border: 1px solid color-mix(in srgb, var(--question-accent) 34%, var(--line));
      border-left: 4px solid var(--question-accent);
      border-radius: 14px;
      color: var(--question-ink);
      background:
        repeating-linear-gradient(0deg, transparent 0 19px, color-mix(in srgb, var(--question-accent) 5%, transparent) 20px),
        linear-gradient(115deg, color-mix(in srgb, var(--question-accent) 7%, var(--card)), var(--card) 72%);
      box-shadow: inset 0 0 24px color-mix(in srgb, var(--question-accent) 5%, transparent);
    }

    .question-hint {
      margin-bottom: 23px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      min-height: 56px;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 11px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--card);
      text-align: left;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease, box-shadow .16s ease;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 5px 15px rgb(105 88 232 / 9%);
    }

    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 48%, transparent);
      outline-offset: 3px;
    }

    .answer-letter {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--page);
      font-size: 12px;
      font-weight: 750;
      transition: inherit;
    }

    .answer-copy { font-size: 14px; font-weight: 560; }
    .answer:disabled { cursor: default; }

    .answer.correct {
      border-color: color-mix(in srgb, var(--green) 55%, var(--line));
      background: var(--green-bg);
      animation: pop .32s ease both;
    }

    .answer.correct .answer-letter {
      border-color: transparent;
      color: var(--green);
      background: color-mix(in srgb, var(--green) 13%, var(--card));
    }

    .answer.wrong {
      border-color: color-mix(in srgb, var(--red) 50%, var(--line));
      background: var(--red-bg);
      animation: shake .38s ease both;
    }

    .answer.wrong .answer-letter {
      border-color: transparent;
      color: var(--red);
      background: color-mix(in srgb, var(--red) 12%, var(--card));
    }

    .feedback {
      min-height: 28px;
      margin: 14px 0 0;
      font-size: 13px;
      font-weight: 650;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .action-row {
      display: flex;
      min-height: 50px;
      align-items: end;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .next-button, .restart-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #6958e8;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 16px rgb(105 88 232 / 21%);
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .next-button[hidden] { display: none; }
    .next-button:not(:disabled):hover, .restart-button:hover { transform: translateY(-1px); box-shadow: 0 9px 20px rgb(105 88 232 / 28%); }
    .next-button:disabled { opacity: .55; cursor: wait; }

    .result {
      position: relative;
      padding: 44px 34px 38px;
      text-align: center;
    }

    .result.celebrate {
      background:
        radial-gradient(ellipse at 50% 0%, rgb(126 107 255 / 18%), transparent 62%),
        radial-gradient(ellipse at 50% 100%, rgb(74 211 171 / 10%), transparent 55%);
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -16px;
      left: var(--x);
      width: 8px;
      height: 13px;
      border-radius: 2px;
      background: var(--confetti-color);
      opacity: 0;
      animation: confetti-fall 2.6s var(--delay) cubic-bezier(.3,.65,.5,1) both;
    }

    .result-emoji {
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      margin: 0 auto 22px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--accent-soft);
      font-size: 47px;
      animation: float 2.8s ease-in-out infinite;
    }

    .result.celebrate .result-emoji {
      border-color: rgb(255 196 76 / 55%);
      background: linear-gradient(145deg, #fff0b8, #ffd889);
      box-shadow: 0 10px 30px rgb(255 177 53 / 25%);
      animation: celebrate-pop .65s cubic-bezier(.2,1.5,.4,1) both, float 2.8s .65s ease-in-out infinite;
    }

    @media (prefers-color-scheme: dark) {
      .result.celebrate .result-emoji {
        border-color: rgb(255 208 105 / 40%);
        background: linear-gradient(145deg, #52452c, #3c3428);
      }
    }

    .celebration-label {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 11px;
      border: 1px solid rgb(237 172 57 / 36%);
      border-radius: 999px;
      color: #a76d08;
      background: rgb(255 205 100 / 17%);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    @media (prefers-color-scheme: dark) {
      .celebration-label { color: #ffd477; }
    }

    .result h1 { margin-bottom: 10px; }
    .result-copy { max-width: 350px; margin: 0 auto 25px; color: var(--muted); font-size: 14px; }

    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 25px;
      padding: 12px 19px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--page);
    }

    .result-score strong { font-size: 28px; letter-spacing: -.05em; }
    .result-score span { color: var(--muted); font-size: 13px; }
    .result .restart-button { margin: 0 auto; }

    .footer-note {
      margin: 19px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { transform: scale(.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes bump { 50% { transform: scale(1.11); } }
    @keyframes float { 50% { transform: translateY(-5px) rotate(2deg); } }
    @keyframes celebrate-pop { from { transform: scale(.45) rotate(-18deg); } to { transform: scale(1) rotate(0); } }
    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -10px, 0) rotate(0); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 480px, 0) rotate(var(--spin)); }
    }
    @keyframes star-drift { to { transform: translate3d(0, 10px, 0); } }

    @media (max-width: 520px) {
      body { padding: 22px 14px 32px; }
      .topbar { margin-bottom: 23px; }
      .card-inner { padding: 25px 20px 24px; }
      .result { padding: 38px 21px 30px; }
      .progress-track { margin-bottom: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit</div>
      <span class="edition">The space quiz</span>
    </header>
    <section class="quiz-card" aria-label="Space exploration quiz">
      <div id="quiz" class="card-inner">
        <div class="quiz-meta">
          <span class="question-count" id="questionCount"><strong>01</strong> <span aria-hidden="true">/</span> 10</span>
          <span class="score-pill" id="scorePill" aria-label="Score: 0"><span aria-hidden="true">✧</span> Score <strong id="score">0</strong></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="eyebrow">Mission briefing</p>
        <h1 id="question" tabindex="-1"></h1>
        <p class="question-hint">Choose the best answer to continue.</p>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="action-row">
          <button class="next-button" id="nextButton" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div id="result" class="result" hidden aria-live="polite"></div>
    </section>
    <p class="footer-note">A small step for your brain. A giant leap through space. 🚀</p>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1 },
      { question: "What was the first human-made object to reach space?", answers: ["Sputnik 1", "V-2 rocket", "Apollo 11", "Explorer 1"], correct: 1 },
      { question: "Who was the first person to walk on the Moon?", answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Michael Collins"], correct: 2 },
      { question: "Which is the largest planet in our solar system?", answers: ["Saturn", "Neptune", "Earth", "Jupiter"], correct: 3 },
      { question: "What is the name of our galaxy?", answers: ["Andromeda", "The Milky Way", "Whirlpool", "Sombrero"], correct: 1 },
      { question: "What does a light-year measure?", answers: ["Time", "Brightness", "Distance", "Speed"], correct: 2 },
      { question: "Which space telescope launched in 2021?", answers: ["Hubble", "Kepler", "Chandra", "James Webb"], correct: 3 },
      { question: "Which planet has the most prominent ring system?", answers: ["Saturn", "Uranus", "Mars", "Earth"], correct: 0 },
      { question: "What was the first artificial satellite in orbit?", answers: ["Vanguard 1", "Sputnik 1", "Luna 1", "Explorer 1"], correct: 1 },
      { question: "What is the name of NASA's robotic rover exploring Mars since 2021?", answers: ["Curiosity", "Spirit", "Perseverance", "Opportunity"], correct: 2 }
    ];

    const quiz = document.getElementById("quiz");
    const result = document.getElementById("result");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");
    const scorePill = document.getElementById("scorePill");
    const countEl = document.getElementById("questionCount");
    const progress = document.querySelector(".progress-track");
    const progressFill = document.getElementById("progressFill");
    const nextButton = document.getElementById("nextButton");
    let current = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      countEl.innerHTML = `<strong>${String(current + 1).padStart(2, "0")}</strong> <span aria-hidden="true">/</span> ${questions.length}`;
      progress.setAttribute("aria-valuenow", current);
      progressFill.style.width = `${(current / questions.length) * 100}%`;
      questionEl.textContent = item.question;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      nextButton.hidden = true;
      answersEl.replaceChildren(...item.answers.map((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.index = index;
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span class="answer-copy"></span>`;
        button.querySelector(".answer-copy").textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        return button;
      }));
    }

    function chooseAnswer(choice) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answersEl.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });
      const isCorrect = choice === item.correct;
      buttons[item.correct].classList.add("correct");
      if (isCorrect) {
        score += 1;
        scoreEl.textContent = score;
        scorePill.setAttribute("aria-label", `Score: ${score}`);
        scorePill.classList.remove("bump");
        void scorePill.offsetWidth;
        scorePill.classList.add("bump");
        feedbackEl.textContent = ["Brilliant! That's right. ✨", "Exactly right. You're on a roll! 🌟", "Nailed it, space explorer! 🚀"][current % 3];
        feedbackEl.classList.add("good");
      } else {
        buttons[choice].classList.add("wrong");
        feedbackEl.textContent = `Not quite — the answer is ${item.answers[item.correct]}.`;
        feedbackEl.classList.add("bad");
      }
      progress.setAttribute("aria-valuenow", current + 1);
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      nextButton.innerHTML = current === questions.length - 1 ? "See your results <span aria-hidden=\"true\">→</span>" : "Next question <span aria-hidden=\"true\">→</span>";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResult() {
      quiz.hidden = true;
      const celebrated = score >= 8;
      const reaction = score === 10 ? "🏆" : celebrated ? "🎉" : score >= 4 ? "🌙" : "🚀";
      const title = score === 10 ? "Out of this world!" : celebrated ? "Stellar achievement!" : score >= 4 ? "Nice exploring!" : "Mission complete!";
      const message = score === 10
        ? "A perfect flight! You really know your way around the cosmos."
        : celebrated
          ? "You aced your mission! The whole galaxy is cheering you on."
          : score >= 4
            ? "You’re finding your orbit. There’s always more universe to discover."
            : "Every great explorer starts somewhere. Ready for another launch?";
      result.classList.toggle("celebrate", celebrated);
      const confetti = celebrated
        ? `<div class="confetti-layer" aria-hidden="true">${Array.from({ length: 32 }, (_, index) => `<span class="confetti" style="--x:${(index * 37) % 100}%;--delay:${((index * 13) % 80) / 100}s;--drift:${(index % 2 ? 1 : -1) * (20 + (index * 17) % 70)}px;--spin:${180 + (index * 53) % 540}deg;--confetti-color:${["#ffca58", "#ff758c", "#75d8b2", "#9b8bff", "#63b8f4"][index % 5]}"></span>`).join("")}</div>`
        : "";
      result.innerHTML = `${confetti}<div class="result-emoji" aria-hidden="true">${reaction}</div>${celebrated ? '<p class="celebration-label">Galactic high score</p>' : ""}<p class="eyebrow">Mission complete</p><h1 tabindex="-1">${title}</h1><p class="result-copy">${message}</p><div class="result-score"><strong>${score}</strong><span>out of ${questions.length} correct</span></div><br><button class="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>`;
      result.hidden = false;
      result.querySelector("button").addEventListener("click", restart);
      result.querySelector("h1").focus();
    }

    function restart() {
      current = 0;
      score = 0;
      scoreEl.textContent = "0";
      scorePill.setAttribute("aria-label", "Score: 0");
      result.hidden = true;
      quiz.hidden = false;
      renderQuestion();
      questionEl.focus();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (current === questions.length - 1) showResult();
      else {
        current += 1;
        renderQuestion();
        questionEl.focus();
      }
    });

    renderQuestion();
  </script>
</body>
</html>
